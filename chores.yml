version: "3"
chore_min_version: 0.6.0

# THE CONTRACT THIS FILE EXISTS TO OWN.
#
# Every CI job has a local equivalent here, and CI is the copy that runs
# the same commands -- if the two ever differ, this is the copy that is
# wrong. `chore check` is everything that runs on macOS/Linux;
# `chore smoke` is the Windows end-to-end test, driven from here against
# a Windows host exactly as CI drives it against its own runner.
#
# These tasks run from the harness checkout. They need bash, python3
# (3.11+, for tomllib) and cargo; `config` also needs `jsonschema>=4.19`,
# `lint` needs shellcheck.
#
# QUIET BY DEFAULT, --verbose ON REQUEST, AND THE BUDGET IS A NUMBER.
#
#   A task prints a VERDICT: one line saying it passed, how much it printed,
#   and the log holding the run -- tmp/logs/<task>.log, kept in full. A
#   failure prints a verdict too -- its status, the log and the log's size --
#   and no tail unless OUTPUT_BUDGET_FAIL_TAIL=N asks for one. `chore <task>
#   -- --verbose` (or OUTPUT_BUDGET_VERBOSE=1) streams the whole run as well.
#
#   The wrapper behind all of this is rust-fs-core's scripts/output-budget.sh,
#   resolved at run time by scripts/resolve-output-budget.sh and NOT committed
#   here. `chore siblings` is what puts core where that script looks; without
#   it every task below fails loudly rather than running unbudgeted.
#
#   Each task carries an OUTPUT BUDGET, lines and bytes, and a run that
#   passed but printed more fails with status 65 -- told apart from a failing
#   suite by its status. Measured on an arm64 Mac, taking the larger of a
#   cold build (every crate compiled, so a line per crate) and a warm one:
#
#     task            measured        budget
#     lint              84 / 3,780     112 / 5,000   CI cold, 2026-10-02
#     test             148 / 7,398     200 / 10,000  CI cold, 2026-10-02
#     state-machine     34 / 1,634      50 / 2,400
#     config             8 /   674      20 / 1,500
#     output-budget     39 / 1,957    120 / 12,000   measured 2026-09-26
#     agents-core       11 /   445     20 / 1,000   measured 2026-09-30
#     remote-timeout    18 / 1,022     25 / 1,500   measured 2026-10-02
#     smoke            348 / 42,000   500 / 60,000   end-to-end VM transcript
#
#   THE LINT AND TEST ROWS MOVED ON 2026-10-02. On fs-windows-test-harness#40
#   both CI jobs missed their cargo cache (a new stable toolchain is a new
#   cache key) and printed the registry update and every crate downloaded --
#   lines the Mac measurement never saw. lint printed 84 lines / 3,780 bytes
#   (70/2,400 -> 112/5,000); test printed 148 / 7,398, 42 of those lines the
#   registry and downloads and 3 the pull request's new tests (140/6,000 ->
#   200/10,000). Each is the CI measurement plus a third. No dependency was
#   added; any cold CI run on main prints the same.
#
#   Raise one DELIBERATELY when a task grows. A budget nobody can breach
#   measures nothing, and tests/output-budget.sh fails a task that has none.
#   Why any of this: see the README, "Output: quiet by default".

vars:
  # The one sibling this repository has. It supplies the canonical
  # output-budget wrapper and the agents-core check, both run in place. The
  # pin is a FLOOR -- `chore siblings` never moves a core checkout backwards
  # to satisfy it. v0.3.3 is the release whose agents-core check reads the
  # guide of the repository it is run for; below v0.2.11 the wrapper does not
  # exist at all.
  FS_CORE_URL: https://github.com/antimatter-studios/rust-fs-core.git
  FS_CORE_REF: v0.3.8

tasks:
  siblings:
    desc: Clone or advance ../rust-fs-core, which supplies the output-budget wrapper
    env:
      FS_CORE_URL: '{{.FS_CORE_URL}}'
      FS_CORE_REF: '{{.FS_CORE_REF}}'
    cmds:
      - bash scripts/siblings.sh

  lint:
    desc: Shell syntax + shellcheck, cargo fmt + clippy (CI job `lint`)
    cmds:
      - |
        scripts/task.sh lint lint 112 5000 -- bash -c '
          set -e
          for f in scripts/*.sh scripts/host/*.sh tests/*.sh tests/smoke-consumer/*.sh; do bash -n "$f"; done
          shellcheck -x --severity=error scripts/*.sh scripts/host/*.sh
          shellcheck --severity=error tests/*.sh tests/smoke-consumer/*.sh
          cargo fmt --manifest-path runner/Cargo.toml --all -- --check
          cargo clippy --manifest-path runner/Cargo.toml --all-targets -- -D warnings'

  test:
    desc: Runner unit tests (CI job `runner-unit`)
    cmds:
      - scripts/task.sh test test 200 10000 -- cargo test --manifest-path runner/Cargo.toml --all-features --no-fail-fast

  state-machine:
    desc: claim / update-status / reset against a temp matrix, including concurrent writers (CI job `state-machine`)
    cmds:
      - scripts/task.sh state-machine state-machine 50 2400 -- bash tests/state-machine.sh

  config:
    desc: Every consumer config validates; every invalid fixture is rejected (CI job `config`)
    cmds:
      - scripts/task.sh config config 20 1500 -- python3 tests/validate-configs.py

  output-budget:
    desc: The wrapper resolves from core, and every task is budgeted (CI job `state-machine`)
    cmds:
      - scripts/task.sh output-budget output-budget 120 12000 -- bash tests/output-budget.sh

  remote-timeout:
    desc: A VM command that never returns fails within its bound, naming the command and the scenario (CI job `state-machine`)
    cmds:
      - scripts/task.sh remote-timeout remote-timeout 25 1500 -- bash tests/remote-timeout.sh

  agents-core:
    desc: AGENTS.md carries the shared agent-core block, unmodified, and the check refuses a drifted one (CI job `state-machine`)
    cmds:
      - scripts/task.sh agents-core agents-core 20 1000 -- bash tests/agents-core.sh

  check:
    desc: Every CI job that runs off Windows -- lint, test, state-machine, remote-timeout, output-budget, agents-core, config
    # Sequential on purpose: the first failure stops the run and is the
    # last thing on screen.
    cmds:
      - task: lint
      - task: test
      - task: state-machine
      - task: remote-timeout
      - task: output-budget
      - task: agents-core
      - task: config

  smoke:
    desc: End-to-end smoke test against a Windows host with WinFsp (CI job `smoke`)
    # Runs tests/smoke-consumer through scripts/run-tests.sh: mounts tar
    # images with WinFsp's memfs on the host, drives file ops through the
    # harness's op scripts, and checks that smoke-* scenarios pass and
    # the canary-* scenario is reported failed.
    #
    # The host needs sshd with PowerShell as its default shell and WinFsp
    # installed (`bash scripts/run-tests.sh --reinstall` from
    # tests/smoke-consumer installs it from [vm.packages]). Flags are
    # remembered in tests/smoke-consumer/.test-env, so after the first run
    # plain `chore smoke` is enough.
    #
    #   chore smoke --vm-host user@vm --ssh-key ~/.ssh/vm --vm-workdir C:/fswth/smoke-consumer
    args:
      - {name: vm_host, desc: "user@host of the Windows machine"}
      - {name: ssh_key, desc: "private key that host accepts"}
      - {name: vm_workdir, desc: "scratch dir on that host, e.g. C:/fswth/smoke-consumer"}
    vars:
      vm_host: ""
      ssh_key: ""
      vm_workdir: ""
    # Handed over as environment rather than spliced into the command
    # line, so a path with spaces or quotes arrives intact.
    env:
      SMOKE_VM_HOST: '{{.vm_host}}'
      SMOKE_SSH_KEY: '{{.ssh_key}}'
      SMOKE_VM_WORKDIR: '{{.vm_workdir}}'
    cmds:
      - >-
        scripts/task.sh smoke smoke 500 60000 --
        bash tests/smoke-consumer/run-smoke.sh
        ${SMOKE_VM_HOST:+"--vm-host=$SMOKE_VM_HOST"}
        ${SMOKE_SSH_KEY:+"--ssh-key=$SMOKE_SSH_KEY"}
        ${SMOKE_VM_WORKDIR:+"--vm-workdir=$SMOKE_VM_WORKDIR"}
